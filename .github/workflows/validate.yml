name: Validate app.html

# Catches the class of bug that took the live app down on 2026-07-31: a merge
# conflict resolution left invalid JS in app.html, and since all of its logic
# lives in one <script> block, that syntax error broke the whole app for
# every rebbi the moment it reached main. These are the same checks
# CLAUDE.md documents as manual pre-commit steps — running them here means a
# bad merge fails loudly on the PR instead of shipping silently.
#
# Runs on PRs into main (so it's a merge-blocking check on GitHub) and on
# pushes to main (so a direct push or an admin merge still gets flagged).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: JS syntax check (app.html script blocks)
        run: node .github/scripts/check-js-syntax.js

      - name: CSS comment-delimiter check
        run: node .github/scripts/check-css-balance.js

      - name: migrateData/load2fix sync check (app.html vs test-migration.html)
        run: node .github/scripts/check-migration-sync.js

      - name: Router hash parse/build round-trip (Firebase step 4, PR1)
        run: node .github/scripts/check-router-hash.js

      - name: OAuth fragment parser round-trip (Firebase sign-in UI)
        run: node .github/scripts/check-oauth-fragment.js

      - name: sw.js syntax check
        run: node --check sw.js

  firestore-rules:
    # Firebase rebuild's "test-migration.html analogue" — step 2
    # (docs/Firebase_Step2_Auth_Rules_Design_Proposal.md, "Rules
    # Verification Harness") proves the tier-gating claim mechanically
    # against the Firestore emulator; step 3
    # (docs/Firebase_Step3_Converter_Tool_Design_Proposal.md, "Verification
    # harness implementation") proves provisionRebbi's mode dispatch and
    # overwrite/idempotence guarantees the same way, against the real
    # exported Cloud Function. ubuntu-latest ships a JDK, which the
    # emulators need.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install rules-test dependencies
        run: npm install

      - name: Install Cloud Functions dependencies
        run: npm install
        working-directory: functions

      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ runner.os }}

      - name: Run Firestore rules test matrix against the emulator
        run: npm run test:rules

      - name: Run provisionRebbi mode-dispatch tests against the emulator
        run: npm run test:functions

      - name: Run raw-HTTP callable-function tests (sign-in's actual calling convention)
        run: npm run test:http-callable
